name: Portfolio improvement
description: Propose an improvement to the portfolio or its design documentation.
labels:
  - "type:feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Describe the gap or opportunity and the relevant portfolio context.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what should change and what success looks like.
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Audience and benefit
      description: Identify who benefits, such as programmers or recruiters, and how.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must be met to consider this improvement complete.
      placeholder: "- [ ] An observable condition is met."
    validations:
      required: true
